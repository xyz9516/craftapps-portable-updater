[package]
name = "craftapps-portable-updater"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "craft-launcher"
path = "src/bootstrap.rs"

[[bin]]
name = "craft-runtime"
path = "src/runtime.rs"
